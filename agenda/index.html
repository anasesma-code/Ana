<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Agenda</title>
<meta name="description" content="Agenda personal: citas, trabajo, lista de la compra, menú semanal, presupuesto y planes.">
<meta name="theme-color" content="#6a4cf5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body data-tab="agenda">
<header class="top">
  <div>
    <p class="hoy-txt" id="hoyTxt"></p>
    <h1 id="titulo">Agenda</h1>
  </div>
  <button class="icon-btn" id="btnOpciones" aria-label="Copia de seguridad">
    <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
  </button>
</header>

<main id="vista" aria-live="polite"></main>

<button id="fab" aria-label="Añadir">
  <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav class="tabs" aria-label="Secciones">
  <button data-tab="agenda"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Agenda</span></button>
  <button data-tab="trabajo"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7M3 13h18"/></svg><span>Trabajo</span></button>
  <button data-tab="compra"><svg viewBox="0 0 24 24"><path d="M3 4h2.2l2.3 11h10.3L20 8H6.3"/><circle cx="9" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg><span>Compra</span></button>
  <button data-tab="menu"><svg viewBox="0 0 24 24"><path d="M6 3v6a2 2 0 0 0 4 0V3M8 11v10M18 21V3c-2 1-3.5 4-3.5 8H18"/></svg><span>Menú</span></button>
  <button data-tab="dinero"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2.5"/><path d="M3 10h18M15.5 15h2.5"/></svg><span>Dinero</span></button>
  <button data-tab="planes"><svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.9z"/></svg><span>Planes</span></button>
</nav>

<dialog id="hoja"></dialog>
<div id="toast" role="status"></div>

<script src="app.js"></script>
</body>
</html>
